# The checks that `cargo deny check` makes on the dependencies, in CI and before a release.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# A crate with a known security hole always fails. A crate that is no longer maintained
# fails when open_prs uses it directly; deeper in the tree, it is the job of the crate that
# uses it, and cargo deny only warns.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# The licenses that agree with MIT OR Apache-2.0. A new one fails until it is added here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    # The root certificates in webpki-roots, which rustls uses
    "CDLA-Permissive-2.0",
    # ring and the parts of rustls that check certificates
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io: no other registry and no git repos
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
