[package]
name = "open_prs"
version = "0.1.0"
edition = "2024"
description = "A TUI that lists open PRs on GitHub, Forgejo and Gitea, with their review and CI status"
repository = "https://github.com/carlos-alberto/open-prs"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
keyring-core = "1.0.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
toml = "1.2.0"
toml_edit = "0.25.18"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
