[package]
name = "open_prs"
version = "0.1.0"
edition = "2024"
description = "A TUI that lists open PRs on GitHub, Forgejo and Gitea, with their review and CI status"
repository = "https://github.com/carlos-alberto/open-prs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
toml_edit = "0.25.18"
