[package]
name = "open_prs"
version = "0.1.0"
edition = "2024"
description = "List open PRs on GitHub and Forgejo with their review status, in a TUI"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
